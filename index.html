];
const HR = 52, HW = Math.sqrt(3) * HR;
const TILES = []; ROWS.forEach((r, ri) => r.forEach((n, ci) => {
  TILES.push({ id: TILES.length, name: n, x: HW * (ci + (ri % 2 ? 0 : .5)) + HW / 2 + 6, y: ri * 1.5 * HR + HR + 6 });
}));
const NB = TILES.map(a => TILES.filter(b => b !== a && Math.hypot(a.x - b.x, a.y - b.y) < HW * 1.05).map(b => b.id));
const CASTLES = [5, 10, 14]; // Sopron, Nyíregyháza, Szeged
const VW = Math.ceil(HW * 6 + 12), VH = Math.ceil(HR * 2 + 1.5 * HR * 2 + 12);
function hexPts(x, y){ let p = []; for (let i = 0; i < 6; i++){ const a = Math.PI / 180 * (60 * i - 30); p.push((x + (HR - 2) * Math.cos(a)).toFixed(1) + "," + (y + (HR - 2) * Math.sin(a)).toFixed(1)); } return p.join(" "); }

/* ---------- shared rules ---------- */
const alive = (S, p) => S.players[p] && !S.players[p].out;
function myTiles(S, pid){ return S.tiles.filter(t => t.owner === pid).map(t => t.id); }
function validPicks(S, pid){
  const taken = new Set(Object.values(S.picks || {}));
  const free = S.tiles.filter(t => t.owner === null && !taken.has(t.id)).map(t => t.id);
  const mine = myTiles(S, pid).concat(S.picks && S.picks[pid] != null ? [S.picks[pid]] : []);
  const adj = free.filter(id => NB[id].some(n => mine.includes(n)));
  return adj.length ? adj : free;
}
function validTargets(S, pid){
  const en = S.tiles.filter(t => t.owner !== null && t.owner !== pid && alive(S, t.owner)).map(t => t.id);
  const mine = myTiles(S, pid);
  const adj = en.filter(id => NB[id].some(n => mine.includes(n)));
  return adj.length ? adj : en;
}
function score(S, pid){ return S.tiles.filter(t => t.owner === pid).reduce((s, t) => s + t.value, 0) + (S.players[pid].bonus || 0); }
function fmt(v){ return String(v).replace(".", ","); }

/* ---------- host engine ---------- */
const H = { on:false, S:null, sec:{}, timer:null, conns:{}, mcDeck:[], tipDeck:[] };
function shuf(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function drawMC(){ if (!H.mcDeck.length) H.mcDeck = shuf(DATA.mc.map((_, i) => i)); return DATA.mc[H.mcDeck.pop()]; }
function drawTip(){ if (!H.tipDeck.length) H.tipDeck = shuf(DATA.tips.map((_, i) => i)); return DATA.tips[H.tipDeck.pop()]; }
function log(t){ H.S.log.unshift(t); H.S.log = H.S.log.slice(0, 30); }
function setPhase(ph, ms, fn){
  const S = H.S; S.phase = ph; S.seq++; clearTimeout(H.timer);
  S.dl = ms ? Date.now() + ms : 0; S.dur = ms || 0;
  if (ph !== "q_res") S.resPicks = null;
  if (ms){ const seq = S.seq; H.timer = setTimeout(() => { if (H.S.seq === seq) fn(); }, ms); }
}
function push(){
  const S = H.S;
  const msg = { t:"state", s:S, left: S.dl ? S.dl - Date.now() : 0 };
  if (NET.role === "host") pub(NET.T + "/s", msg, true);
  onState(JSON.parse(JSON.stringify(S)), msg.left);
  bots();
}
function hostInit(name){
  H.on = true;
  H.S = { phase:"lobby", seq:0, dl:0, players:[{ name, bot:false }], tiles:[], picks:{}, log:[] };
}
function hostStart(){
  const S = H.S;
  while (S.players.length < 3) S.players.push({ name: BOTN[S.players.length], bot:true });
  S.players.forEach(p => { p.bonus = 0; p.out = false; });
  S.tiles = TILES.map(t => ({ id:t.id, owner:null, value:0, towers:0 }));
  CASTLES.forEach((tid, i) => { Object.assign(S.tiles[tid], { owner:i, value:1000, towers:3 }); });
  S.log = []; S.round = 0; S.ctx = null; S.att = null; S.final = null;
  S.stats = S.players.map(() => ({ q:0, ok:0, t:0, tipN:0, tipW:0, attN:0, attW:0, defN:0, defW:0, castles:0 }));
  log("Indul a játék! Mindenkinek van egy vára (3 bástya).");
  expRound();
}
function order(S, r){ const o = [0,1,2].filter(p => alive(S, p)); for (let i = 0; i < r % o.length; i++) o.push(o.shift()); return o; }
function freeCount(S){ return S.tiles.filter(t => t.owner === null).length; }

function expRound(){
  const S = H.S; S.round++; S.picks = {}; S.order = order(S, S.round - 1); S.turn = 0;
  nextPicker();
}
function nextPicker(){
  const S = H.S;
  const taken = Object.keys(S.picks).length;
  if (S.turn >= S.order.length || freeCount(S) - taken <= 0) return expQ();
  S.cur = S.order[S.turn];
  setPhase("exp_pick", T_PICK, () => { const v = validPicks(H.S, H.S.cur); doPick(H.S.cur, v[Math.floor(Math.random() * v.length)]); });
  push();
}
function doPick(pid, tile){
  const S = H.S;
  if (S.phase === "exp_pick"){
    if (pid !== S.cur || !validPicks(S, pid).includes(tile)) return;
    S.picks[pid] = tile; S.turn++; nextPicker();
  } else if (S.phase === "tip_pick"){
    if (pid !== S.cur || !validPicks(S, pid).includes(tile)) return;
    Object.assign(S.tiles[tile], { owner:pid, value:200 });
    log(S.players[pid].name + " elfoglalta: " + TILES[tile].name);
    afterExp();
  } else if (S.phase === "bat_pick"){
    if (pid !== S.cur || !validTargets(S, pid).includes(tile)) return;
    S.att = { a:pid, d:S.tiles[tile].owner, tile };
    log(S.players[pid].name + " megtámadja: " + TILES[tile].name + " (" + S.players[S.att.d].name + ")");
    askMC([pid, S.att.d], "bat");
  }
}
function askMC(need, ctx){
  const S = H.S; const c = drawMC(); const perm = shuf([0,1,2,3]);
  H.sec = { correct: perm.indexOf(0), ans:{}, t0: Date.now() };
  S.ctx = ctx; S.need = need; S.answered = {}; S.reveal = null;
  S.q = { id:c.id, d:c.d, text:c.q, opts: perm.map(i => c.o[i]), expl:c.a };
  setPhase("q", T_Q, revealMC); push();
}
function expQ(){
  const S = H.S;
  if (!Object.keys(S.picks).length) return afterExp();
  askMC(S.order.slice(), "exp");
}
function doAnswer(pid, c){
  const S = H.S;
  if (S.phase !== "q" || !S.need.includes(pid) || S.answered[pid]) return;
  H.sec.ans[pid] = { c, t: Date.now() - H.sec.t0 }; S.answered[pid] = true;
  if (S.need.every(p => S.answered[p])) revealMC(); else push();
}
function revealMC(){
  const S = H.S; const ok = p => H.sec.ans[p] && H.sec.ans[p].c === H.sec.correct;
  S.reveal = { correct: H.sec.correct, ans: H.sec.ans, ok: Object.fromEntries(S.need.map(p => [p, ok(p)])) };
  S.need.forEach(p => { const st = S.stats[p]; st.q++; if (H.sec.ans[p]){ st.t += H.sec.ans[p].t; } else st.t += T_Q; if (ok(p)) st.ok++; });
  if (S.ctx === "exp"){
    S.resPicks = {};
    for (const p in S.picks){
      const pid = +p, t = S.picks[p];
      S.resPicks[p] = { tile:t, ok:ok(pid) };
      if (ok(pid)){ Object.assign(S.tiles[t], { owner:pid, value:200 }); log(S.players[pid].name + " ✓ megszerezte: " + TILES[t].name); }
      else log(S.players[pid].name + " ✗ elvesztette: " + TILES[t].name);
    }
    S.picks = {};
    const rp = S.resPicks; setPhase("q_res", T_RES, afterExp); S.resPicks = rp;
  } else {
    const { a, d } = S.att;
    if (ok(a) && ok(d)) setPhase("q_res", T_RES, () => askTip([a, d], "bat"));
    else setPhase("q_res", T_RES, () => battleOutcome(ok(a) ? a : d));
  }
  push();
}
function afterExp(){
  const S = H.S;
  if (!freeCount(S)) return batStart();
  if (S.round < EXP_ROUNDS) return expRound();
  askTip(S.players.map((_, i) => i).filter(p => alive(S, p)), "exp");
}
function askTip(need, ctx){
  const S = H.S; const t = drawTip();
  H.sec = { v:t.v, ans:{}, t0: Date.now() };
  S.ctx = ctx; S.need = need; S.answered = {}; S.reveal = null;
  S.q = { text:t.q, unit:t.u };
  setPhase("tip", T_TIP, revealTip); push();
}
function doTip(pid, v){
  const S = H.S;
  if (S.phase !== "tip" || !S.need.includes(pid) || S.answered[pid] || !isFinite(v)) return;
  H.sec.ans[pid] = { v, t: Date.now() - H.sec.t0 }; S.answered[pid] = true;
  if (S.need.every(p => S.answered[p])) revealTip(); else push();
}
function revealTip(){
  const S = H.S, A = H.sec.ans, V = H.sec.v;
  const rank = S.need.slice().sort((x, y) => {
    const ax = A[x], ay = A[y];
    if (!ax && !ay) return 0; if (!ax) return 1; if (!ay) return -1;
    const dx = Math.abs(ax.v - V), dy = Math.abs(ay.v - V);
    return dx !== dy ? dx - dy : ax.t - ay.t;
  });
  const w = rank[0];
  S.reveal = { v:V, ans:A, rank, winner:w };
  S.need.forEach(p => S.stats[p].tipN++); S.stats[w].tipW++;
  log("Tipp: " + fmt(V) + " " + S.q.unit + " — " + S.players[w].name + " volt a legközelebb");
  if (S.ctx === "exp"){
    setPhase("tip_res", T_RES, () => { H.S.cur = w; setPhase("tip_pick", T_PICK, () => { const v = validPicks(H.S, w); doPick(w, v[Math.floor(Math.random() * v.length)]); }); push(); });
  } else setPhase("tip_res", T_RES, () => battleOutcome(w));
  push();
}
function batStart(){
  const S = H.S; S.round = 0; S.picks = {};
  log("Minden terület gazdára talált — kezdődik a háború!");
  batRound();
}
function batRound(){
  const S = H.S; S.round++; S.order = order(S, S.round - 1); S.turn = 0; nextAttacker();
}
function nextAttacker(){
  const S = H.S;
  if (S.players.filter((_, i) => alive(S, i)).length < 2) return endGame();
  while (S.turn < S.order.length && !alive(S, S.order[S.turn])) S.turn++;
  if (S.turn >= S.order.length){ if (S.round >= BAT_ROUNDS) return endGame(); return batRound(); }
  S.cur = S.order[S.turn]; S.att = null; S.q = null; S.reveal = null;
  setPhase("bat_pick", T_PICK, () => { const v = validTargets(H.S, H.S.cur); doPick(H.S.cur, v[Math.floor(Math.random() * v.length)]); });
  push();
}
function battleOutcome(w){
  const S = H.S, { a, d, tile } = S.att, t = S.tiles[tile];
  S.stats[a].attN++; S.stats[d].defN++; if (w === a) S.stats[a].attW++; else S.stats[d].defW++;
  if (w === a){
    if (t.towers > 0){
      t.towers--;
      if (t.towers === 0){
        S.tiles.forEach(x => { if (x.owner === d) x.owner = a; });
        S.players[d].out = true; S.stats[a].castles++;
        log("🏰 " + S.players[a].name + " bevette " + S.players[d].name + " várát — minden területe az övé!");
        S.att.msg = "bevette " + S.players[d].name + " várát! Minden területe az övé.";
      } else { log(S.players[a].name + " ledöntött egy bástyát (" + t.towers + " maradt)"); S.att.msg = "ledöntött egy bástyát — " + t.towers + " maradt."; }
    } else {
      t.owner = a; t.value = Math.max(t.value, 400);
      log(S.players[a].name + " elfoglalta: " + TILES[tile].name + " (400)"); S.att.msg = "elfoglalta: " + TILES[tile].name + " (400 pont)";
    }
    S.att.win = "a";
  } else {
    S.players[d].bonus += 100; S.att.win = "d"; S.att.msg = "megvédte: " + TILES[tile].name + " (+100 pont)";
    log(S.players[d].name + " megvédte (+100)");
  }
  setPhase("bat_res", 2600 / SPEED, () => { H.S.turn++; nextAttacker(); });
  push();
}
function endGame(){
  const S = H.S;
  S.att = null; S.picks = {};
  S.final = S.players.map((_, i) => i).sort((x, y) => (S.players[x].out - S.players[y].out) || score(S, y) - score(S, x));
  H.tally = H.tally || {};
  S.final.forEach((p, k) => { const n = S.players[p].nm0 || S.players[p].name, T = H.tally[n] = H.tally[n] || { g:0, w:0, pts:0 }; T.g++; T.pts += score(S, p); if (k === 0) T.w++; });
  S.tally = Object.entries(H.tally).map(([n, T]) => ({ n, ...T })).sort((x, y) => y.w - x.w || y.pts - x.pts);
  setPhase("end", 0); push();
}
function hostAct(pid, a){
  if (!a) return;
  if (a.type === "pick") doPick(pid, a.tile);
  else if (a.type === "ans") doAnswer(pid, a.c);
  else if (a.type === "tip") doTip(pid, +a.v);
}
/* bots */
function bots(){
  const S = H.S; if (!S || S.phase === "lobby" || S.phase === "end") return;
  const seq = S.seq, later = (ms, f) => setTimeout(() => { if (H.S.seq === seq) f(); }, ms / SPEED);
  const isBot = p => S.players[p] && S.players[p].bot;
  if (["exp_pick","tip_pick","bat_pick"].includes(S.phase) && isBot(S.cur)){
    const p = S.cur;
    later(900 + Math.random() * 1200, () => {
      let v = S.phase === "bat_pick" ? validTargets(H.S, p) : validPicks(H.S, p);
      if (S.phase === "bat_pick"){ const nc = v.filter(id => !H.S.tiles[id].towers); if (nc.length && Math.random() < .75) v = nc; }
      doPick(p, v[Math.floor(Math.random() * v.length)]);
    });
  }
  if (S.phase === "q") S.need.filter(p => isBot(p) && !S.answered[p] && !H.sec["b" + p + seq]).forEach(p => {
    H.sec["b" + p + seq] = 1;
    later(2500 + Math.random() * 8000, () => { const right = Math.random() < (H.S.q.d === "S" ? .5 : .62); doAnswer(p, right ? H.sec.correct : [0,1,2,3].filter(i => i !== H.sec.correct)[Math.floor(Math.random() * 3)]); });
  });
  if (S.phase === "tip") S.need.filter(p => isBot(p) && !S.answered[p] && !H.sec["b" + p + seq]).forEach(p => {
    H.sec["b" + p + seq] = 1;
    later(3000 + Math.random() * 8000, () => {
      const v = H.sec.v, g = (Math.random() + Math.random() + Math.random() - 1.5) * .25;
      let x = v * (1 + g); x = v >= 100 ? Math.round(x) : Math.round(x * 10) / 10;
      doTip(p, x);
    });
  });
}

/* ---------- network (MQTT relay over WebSocket) ---------- */
const NET = { mq:null, role:null, pid:null, cid:null, T:null };
const QS = new URLSearchParams(location.search);
const BROKERS = QS.get("broker") ? [QS.get("broker")] : ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt"];
function loadMqtt(){
  return new Promise((res, rej) => {
    if (window.mqtt) return res();
    const s = document.createElement("script");
    s.src = QS.get("mqttlib") || "https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js";
    s.onload = res; s.onerror = () => rej(new Error("load"));
    document.head.appendChild(s);
  });
}
function code4(){ const A = "ABCDEFGHJKLMNPQRSTUVWXYZ"; let s = ""; for (let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }
function topic(code){ return "aramfoglalo26/v2/" + code; }
async function mqConnect(will){
  await loadMqtt();
  NET.cid = NET.cid || ("af" + Math.random().toString(36).slice(2, 10));
  let lastErr = new Error("timeout");
  for (const url of BROKERS){
    try {
      const c = await new Promise((res, rej) => {
        const cl = mqtt.connect(url, { clientId: NET.cid, clean:true, reconnectPeriod:2000, connectTimeout:8000, keepalive:20, will });
        const to = setTimeout(() => { cl.end(true); rej(new Error("timeout")); }, 9000);
        cl.once("connect", () => { clearTimeout(to); res(cl); });
        cl.once("error", e => { clearTimeout(to); cl.end(true); rej(e); });
      });
      c.on("offline", () => { UI.net = "offline"; draw(); });
      c.on("connect", () => { if (UI.net){ UI.net = ""; draw(); } });
      return c;
    } catch(e){ lastErr = e; }
  }
  throw lastErr;
}
function pub(t, m, retain){ if (NET.mq) NET.mq.publish(t, JSON.stringify(m), { qos:1, retain: !!retain }); }
function mkConn(cid){ return { cid, send: m => pub(NET.T + "/to/" + cid, m) }; }
async function hostOnline(name){
  const code = code4(); NET.T = topic(code);
  const c = await mqConnect(); NET.mq = c; NET.role = "host"; NET.pid = 0;
  hostInit(name); H.S.code = code;
  c.subscribe(NET.T + "/c", { qos:1 });
  c.on("message", (t, buf) => {
    let m; try { m = JSON.parse(buf.toString()); } catch(e){ return; }
    const S = H.S; if (!m || !m.cid) return;
    const pid = +Object.keys(H.conns).find(k => H.conns[k].cid === m.cid);
    const known = !isNaN(pid);
    if (m.t === "join"){
      if (known){
        const p = S.players[pid];
        if (p && p.bot && p.nm0){ p.bot = false; p.name = p.nm0; log(p.name + " visszatért"); }
        H.conns[pid].send({ t:"welcome", pid }); push(); return;
      }
      if (S.phase !== "lobby" || S.players.length >= 3){ mkConn(m.cid).send({ t:"full" }); return; }
      const np = S.players.length; S.players.push({ name: String(m.name || "Játékos").slice(0, 18), bot:false });
      H.conns[np] = mkConn(m.cid); H.conns[np].send({ t:"welcome", pid:np }); push();
    } else if (m.t === "act" && known) hostAct(pid, m.a);
    else if (m.t === "leave" && known){
      const p = S.players[pid];
      if (S.phase === "lobby"){ delete H.conns[pid]; S.players.splice(pid, 1); reindex(); }
      else if (p && !p.bot){ p.nm0 = p.name; p.bot = true; p.name += " (bot)"; log(p.nm0 + " kilépett — bot veszi át"); }
      push();
    }
  });
  return code;
}
function reindex(){ const c = {}; Object.values(H.conns).forEach((conn, i) => { c[i + 1] = conn; conn.send({ t:"welcome", pid:i + 1 }); }); H.conns = c; }
async function joinOnline(code, name){
  code = code.toUpperCase(); NET.T = topic(code); NET.role = "client";
  NET.cid = NET.cid || ("af" + Math.random().toString(36).slice(2, 10));
  const c = await mqConnect({ topic: NET.T + "/c", payload: JSON.stringify({ t:"leave", cid: NET.cid }), qos:1, retain:false });
  NET.mq = c;
  return new Promise((res, rej) => {
    let done = false;
    const to = setTimeout(() => { if (!done){ c.end(true); NET.mq = null; rej(new Error("noroom")); } }, 10000);
    c.subscribe([NET.T + "/s", NET.T + "/to/" + NET.cid], { qos:1 }, () => pub(NET.T + "/c", { t:"join", cid: NET.cid, name }));
    c.on("connect", () => { if (done) pub(NET.T + "/c", { t:"join", cid: NET.cid, name }); });
    c.on("message", (t, buf) => {
      let m; try { m = JSON.parse(buf.toString()); } catch(e){ return; }
      if (m.t === "welcome"){ NET.pid = m.pid; if (!done){ done = true; clearTimeout(to); res(); } if (UI.S) draw(); }
      else if (m.t === "full"){ if (!done){ done = true; clearTimeout(to); c.end(true); rej(new Error("full")); } }
      else if (m.t === "state" && done && m.s && m.s.code === code) onState(m.s, m.left);
    });
  });
}
function act(a){ if (NET.role === "client") pub(NET.T + "/c", { t:"act", cid: NET.cid, a }); else hostAct(NET.pid, a); }

function rot(arr, r){ const o = arr.slice(); for (let i = 0; i < r % (o.length || 1); i++) o.push(o.shift()); return o; }
function timelineHTML(S, me){
  const ph = S.phase, war = isWar(S) || ph === "end";
  const tipStage = !war && S.ctx === "exp" && ["tip","tip_res","tip_pick"].includes(ph);
  const alivePs = [0,1,2].filter(p => alive(S, p));
  const segs = [];
  let rem = 0; // estimated remaining seconds
  for (let r = 1; r <= EXP_ROUNDS; r++){
    const ord = r === S.round && !war && !tipStage && S.order ? S.order : rot([0,1,2], r - 1);
    const segDone = war || tipStage || r < S.round, segNow = !segDone && r === S.round;
    const steps = ord.map((p, k) => {
      let st = segDone ? "done" : !segNow ? "" : ph === "exp_pick" ? (k < S.turn ? "done" : k === S.turn ? "now" : "") : "done";
      if (st !== "done") rem += 7;
      return { p, st, t: PN(S, p) + " mezőt választ" };
    });
    const qst = segDone ? "done" : segNow && (ph === "q" || ph === "q_res") ? "now" : "";
    if (qst !== "done") rem += 17;
    steps.push({ q:"?", st:qst, t:"Kérdés mindenkinek" });
    segs.push({ lbl:"Terjeszkedés " + r, steps, now: segNow, done: segDone });
  }
  const free = S.tiles.filter(t => t.owner === null).length;
  const tipsN = tipStage ? free : null;
  const tipDone = war, tipNow = tipStage;
  if (!tipDone) rem += (tipStage ? free : 2) * 26;
  segs.push({ lbl:"Tippkérdések", steps:[{ q:"#", st: tipDone ? "done" : tipNow ? "now" : "", t:"Tippkérdések a maradék mezőkért", x: tipsN != null ? "×" + tipsN : "" }], now:tipNow, done:tipDone, tip:true });
  for (let r = 1; r <= BAT_ROUNDS; r++){
    const inRound = war && ph !== "end" && r === S.round;
    const ord = inRound && S.order ? S.order : rot(alivePs, r - 1);
    const segDone = ph === "end" || (war && r < S.round), segNow = inRound;
    const steps = ord.map((p, k) => {
      let st = segDone ? "done" : !segNow ? "" : k < S.turn ? "done" : k === S.turn ? "now" : "";
      if (!alive(S, p) && st !== "done") st = "skip";
      if (st === "" || st === "now") rem += 30;
      return { p, st, att:true, t: PN(S, p) + " támad" };
    });
    segs.push({ lbl:"Háború " + r, steps, now: segNow, done: segDone });
  }
  const end = ph === "end";
  const mins = Math.round(rem / 60);
  const eta = end ? "Vége" : rem < 60 ? "< 1 perc van hátra" : "≈ " + mins + " perc van hátra";
  UI.eta = end ? "" : rem < 60 ? "< 1 perc" : "≈ " + mins + " perc";
  let h = "";
  segs.forEach(sg => {
    h += `<div class="seg${sg.now ? " on" : ""}${sg.done ? " done" : ""}"><div class="sl">${esc(sg.lbl)}</div><div class="ss">`;
    sg.steps.forEach(st => {
      const cls = "st " + st.st + (st.st === "now" ? " now" : "");
      if (st.p != null) h += `<span class="${cls}${st.att ? " att" : ""}${st.p === me ? " me" : ""}" style="--c:${PCOL[st.p]}" title="${st.t}">${esc(ini(S.players[st.p].name))}</span>`;
      else h += `<span class="${cls} qq" title="${st.t}">${st.q}${st.x ? `<small>${st.x}</small>` : ""}</span>`;
    });
    h += `</div></div>`;
  });
  h += `<div class="seg fin${end ? " on" : ""}"><div class="sl">Cél</div><div class="ss"><span class="st ${end ? "now" : ""} qq">${IC.flag(14, "currentColor")}</span><span class="eta">${eta}</span></div></div>`;
  return h;
}
function awards(S){
  const st = S.stats || [], ps = S.players.map((_, i) => i);
  const A = {}; const give = (fn, lbl, better) => {
    const vals = ps.map(p => fn(st[p])); const ok = vals.filter(v => v != null);
    if (!ok.length) return; const best = better === "min" ? Math.min(...ok) : Math.max(...ok);
    if (better !== "min" && best <= 0) return;
    ps.forEach((p, i) => { if (vals[i] === best) (A[p] = A[p] || []).push(lbl); });
  };
  give(s => s.q ? s.ok / s.q : null, "Legpontosabb");
  give(s => s.q && s.ok ? s.t / s.q : null, "Leggyorsabb", "min");
  give(s => s.tipW, "Tippkirály");
  give(s => s.attW, "Hódító");
  give(s => s.defW, "Várvédő");
  return A;
}
function leaderboardHTML(S){

      <div class="lb-stats">

      </div>
      ${A[p] ? `<div class="lb-aw">${A[p].map(a => `<span class="aw">${a}</span>`).join("")}</div>` : ""}
    </li>`;
  });
  h += `</ol>`;
  if (S.tally && S.tally.some(t => t.g > 1)) h += `<div class="lbl" style="margin-top:16px">Összesítés (ebben a szobában)</div><table class="res tally">${S.tally.map(t => `<tr><td>${esc(t.n)}</td><td class="r">${t.w} győzelem</td><td class="r">${t.g} játék</td><td class="r">${t.pts} pont</td></tr>`).join("")}</table>`;
  return h;
}

function header(S){
  const war = isWar(S) || S.phase === "end";
  const dots = (n, f) => [1,2,3].map(k => `<b class="${k <= f ? "f" : ""}"></b>`).join("");

    <div class="steps"><div class="step ${!war ? "on" : ""}"><span>Terjeszkedés</span><i>${dots(3, ef)}</i></div>
    <div class="step ${war && S.phase !== "end" ? "on" : ""}"><span>Háború</span><i>${dots(3, wf)}</i></div>${UI.eta ? `<div class="step" title="Becsült hátralévő idő">${IC.flag(15, "currentColor")} ${UI.eta}</div>` : ""}</div>
    <div class="timer" id="tmr"><svg viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="19"/><circle class="rng" id="ring" cx="22" cy="22" r="19" pathLength="100" stroke-dasharray="0 100"/></svg><span id="cd"></span></div>`;
}
function towersHTML(S, i){ const t = S.tiles[CASTLES[i]]; const n = t && t.owner === i ? t.towers : 0; return [0,1,2].map(k => `<i class="${k < n ? "on" : ""}"></i>`).join(""); }
function status(S, i){
  const p = S.players[i], ph = S.phase, R = S.reveal;
  if (p.out) return { t:"kiesett", c:"" };
  let role = "";
  if (S.att && isWar(S)) role = i === S.att.a ? "támad · " : i === S.att.d ? "véd · " : "";
  if (/pick/.test(ph)) return S.cur === i ? { t: ph === "bat_pick" ? "célpontot választ…" : "mezőt választ…", c:"act" } : (S.picks && S.picks[i] != null ? { t:"jelölt: " + TILES[S.picks[i]].name, c:"" } : null);
  if (ph === "q") return S.need.includes(i) ? (S.answered[i] ? { t: role + "✓ válaszolt", c:"ok" } : { t: role + "gondolkodik…", c:"wait" }) : { t:"figyel", c:"" };
  if (ph === "q_res") return S.need.includes(i) ? (R.ok[i] ? { t: role + "✓ jó válasz (" + "ABCD"[R.ans[i].c] + ")", c:"ok" } : R.ans[i] ? { t: role + "✗ rossz (" + "ABCD"[R.ans[i].c] + ")", c:"bad" } : { t: role + "✗ nem felelt", c:"bad" }) : { t:"figyel", c:"" };
  if (ph === "tip") return S.need.includes(i) ? (S.answered[i] ? { t: role + "✓ tippelt", c:"ok" } : { t: role + "gondolkodik…", c:"wait" }) : { t:"figyel", c:"" };
  if (ph === "tip_res" && S.need.includes(i)){ const k = R.rank.indexOf(i); return k === 0 ? { t: role + "legközelebb", c:"win" } : { t: role + (k + 1) + ". hely", c:"" }; }
  if (ph === "bat_res" && S.att && (i === S.att.a || i === S.att.d)){ const won = (S.att.win === "a") === (i === S.att.a); return { t: won ? "győzött" : "vesztett", c: won ? "ok" : "bad" }; }
  if (ph === "end"){ const k = S.final.indexOf(i); return { t: k === 0 ? "győztes" : (k + 1) + ". hely", c: k === 0 ? "win" : "" }; }
  return null;
}

function mapSVG(S, me){
  const myTurn = S.cur === me && /pick/.test(S.phase) && S.players[me] && !S.players[me].out;
  const sel = myTurn ? (S.phase === "bat_pick" ? validTargets(S, me) : validPicks(S, me)) : [];
  const pickBy = {}; Object.entries(S.picks || {}).forEach(([p, t]) => pickBy[t] = +p);
  const resBy = {}; Object.entries(S.resPicks || {}).forEach(([p, r]) => resBy[r.tile] = { p:+p, ok:r.ok });
  let defs = "<defs>" + [0,1,2].map(i => `<linearGradient id="gp${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${PCOL[i]};stop-opacity:1"/><stop offset="1" style="stop-color:${PCOL[i]};stop-opacity:.78"/></linearGradient>`).join("") + "</defs>";
  let g = "", over = "";
  TILES.forEach(t => {
    const st = S.tiles[t.id], own = st.owner, castle = CASTLES.includes(t.id) && st.value === 1000;
    const fill = own === null ? "var(--hexfree)" : `url(#gp${own})`;
    const op = own === null ? 1 : castle ? 1 : st.value >= 400 ? 1 : .8;
    const cl = sel.includes(t.id), dim = myTurn && !cl;
    const ink = own === null ? "var(--hexink)" : "var(--tile-ink)";
    g += `<g class="${cl ? "cl" : ""}${dim ? " dim" : ""}" data-t="${t.id}"><polygon class="hx${cl ? " click" : ""}" points="${hexPts(t.x, t.y)}" fill="${fill}" fill-opacity="${op}"/>`;
    if (pickBy[t.id] != null){ const p = pickBy[t.id]; g += `<polygon points="${hexPts(t.x, t.y)}" fill="${PCOL[p]}" fill-opacity=".22" stroke="${PCOL[p]}" stroke-width="4" stroke-dasharray="7 5"/>`; }
    if (castle){
      g += `<text class="tn" x="${t.x}" y="${t.y - 18}" fill="${ink}">${esc(t.name)}</text><path transform="translate(${t.x},${t.y + 2})" d="M-14 10v-16h5v5h4v-5h10v5h4v-5h5v16z" fill="var(--tile-ink)"/>`;
      g += [0,1,2].map(k => `<rect x="${t.x - 14 + k * 10}" y="${t.y + 17}" width="8" height="8" rx="2" fill="var(--tile-ink)" fill-opacity="${k < st.towers ? 1 : .3}"/>`).join("");
    } else {
      g += `<text class="tn" x="${t.x}" y="${t.y + (own === null ? 4 : -3)}" fill="${ink}">${esc(t.name)}</text>`;
      if (own !== null) g += `<text class="tv" x="${t.x}" y="${t.y + 15}" fill="${ink}">${st.value}</text>`;
    }
    g += `</g>`;
    if (cl) over += `<polygon class="sel" points="${hexPts(t.x, t.y)}"/>`;
    if (pickBy[t.id] != null){ const p = pickBy[t.id]; over += badge(t.x, t.y - HR + 8, PCOL[p], ini(S.players[p].name)); }
    if (resBy[t.id]){ const r = resBy[t.id]; over += badge(t.x - 12, t.y - HR + 8, PCOL[r.p], ini(S.players[r.p].name)) + badge(t.x + 12, t.y - HR + 8, r.ok ? "var(--ok)" : "var(--bad)", r.ok ? "✓" : "✗"); }
    if (S.att && S.att.tile === t.id && S.phase !== "end"){ over += `<polygon class="tgt" points="${hexPts(t.x, t.y)}"/>` + badge(t.x - 12, t.y - HR + 8, PCOL[S.att.a], ini(S.players[S.att.a].name)) + badge(t.x + 12, t.y - HR + 8, "var(--bad)", "⚔"); }
  });
  const legend = `<div class="legend">${S.players.map((p, i) => `<span><i style="background:${PCOL[i]}"></i>${PN(S, i)}</span>`).join("")}<span><i style="background:var(--hexfree)"></i>szabad</span>${myTurn ? '<span style="color:var(--ink);font-weight:600">▣ szaggatott = választható</span>' : ""}</div>`;
  return `<svg class="map" viewBox="0 -6 ${VW} ${VH + 6}" role="img" aria-label="Térkép">${defs}${g}${over}</svg>${legend}`;
}
function badge(x, y, col, txt){ return `<g class="bdg"><rect x="${x - 12}" y="${y - 12}" width="24" height="24" rx="7" fill="${col}" stroke="var(--panel)" stroke-width="3"/><text x="${x}" y="${y + 4.5}">${esc(txt)}</text></g>`; }

function ctxLine(S){
  if (S.ctx === "bat" && S.att) return `<div class="ctx">${chip(S, S.att.a, "támad")}<span class="vs">${IC.swords(18, "var(--bad)")}</span>${chip(S, S.att.d, "véd")}<span class="note">· ${esc(TILES[S.att.tile].name)}${S.tiles[S.att.tile].towers ? " (vár)" : ""}</span></div>`;
  if (S.phase === "q" && S.picks && Object.keys(S.picks).length) return `<div class="ctx"><span class="note">Aki jól felel, megkapja:</span>${Object.entries(S.picks).map(([p, t]) => chip(S, +p, "→ " + esc(TILES[t].name))).join("")}</div>`;
  if (S.phase === "q_res" && S.resPicks) return `<div class="ctx">${Object.entries(S.resPicks).map(([p, r]) => chip(S, +p, (r.ok ? "✓ megkapta: " : "✗ elvesztette: ") + esc(TILES[r.tile].name), r.ok ? "ok" : "bad")).join("")}</div>`;
  if (S.ctx === "exp" && (S.phase === "tip" || S.phase === "tip_res")) return `<div class="ctx"><span class="note">Aki a legközelebb tippel, választ egy szabad mezőt.</span></div>`;
  return "";
}
function mainHTML(S, me){
  const ph = S.phase, R = S.reveal;
  if (ph === "end"){
    const f = S.final, ord = [f[1], f[0], f[2]].filter(x => x != null), hgt = { [f[0]]:130, [f[1]]:92, [f[2]]:62 };
    const w = f[0], wp = S.players[w];
    return `<div class="win-card"><div class="lbl">Végeredmény · ${S.round} háborús kör után</div>
      <h2>${IC.crown(48, "#160F3D")}${PN(S, w)} nyert</h2>
      <p style="margin:10px 0 0;font-weight:700;font-size:17px">${score(S, w)} ponttal${S.stats && S.stats[w] && S.stats[w].castles ? ", várostrommal" : ""}.</p>
      <div class="podium">${ord.map(p => `<div class="pod" style="--c:${PCOL[p]}"><div class="nm">${PN(S, p)}</div><div class="sc">${score(S, p)}</div><div class="bar" style="height:${hgt[p]}px">${f.indexOf(p) + 1}</div></div>`).join("")}</div></div>
      ${leaderboardHTML(S)}
      <div class="row" style="margin-top:18px">${NET.role !== "client" ? '<button class="btn pri" data-act="again">Új játék</button>' : '<p class="note">A házigazda indíthat új játékot.</p>'}</div>`;
  }
  if (/pick/.test(ph)){
    const mine = S.cur === me;
    let h = `<div class="lbl">${ph === "bat_pick" ? "Háború · támadás" : ph === "tip_pick" ? "A tipp nyertese választ" : "Terjeszkedés · mezőválasztás"}</div>${qTimer()}`;
    if (mine) h += `<div class="hint">${IC.tap(26, "#160F3D")} ${ph === "bat_pick" ? "Te támadsz! Kattints egy ellenséges mezőre a térképen." : "Te jössz! Kattints egy szaggatott keretes mezőre."}</div>${ph === "bat_pick" ? '<p class="note" style="margin-top:10px">A vár 3 sikeres ostrom után esik el, de akkor minden területe a tiéd.</p>' : ""}`;
    else h += `<div class="waitp">${av(S, S.cur, "lg")}<span>${PN(S, S.cur)} ${ph === "bat_pick" ? "célpontot választ…" : "mezőt választ…"}</span></div>`;
    if (ph === "exp_pick") h += `<ul class="plan">${S.order.map(p => `<li>${av(S, p, "sm")}${PN(S, p)}${S.picks[p] != null ? `<span class="t">→ ${esc(TILES[S.picks[p]].name)}</span>` : `<span class="w">${S.cur === p ? "most választ" : "vár a sorára"}</span>`}</li>`).join("")}</ul>`;
    return h;
  }
  if (ph === "bat_res" && S.att){
    const a = S.att, w = a.win === "a" ? a.a : a.d, txt = a.msg || "";
    return `<div class="lbl">Csata eredménye</div><div class="outcome"><div class="ic ${a.win}">${a.win === "a" ? IC.swords(38, "#fff") : IC.shield(38, "#fff")}</div><div class="big" style="display:flex;gap:12px;align-items:center;justify-content:center">${av(S, w, "lg")}${PN(S, w)}</div><div class="msg">${esc(txt)}</div></div>`;
  }
  if (ph === "q" || ph === "q_res"){
    const need = S.need.includes(me), rev = ph === "q_res";
    let h = `<div class="lbl">${S.ctx === "bat" ? "Csatakérdés" : "Terjeszkedés · kérdés"} · ${esc(S.q.id)}</div>${ctxLine(S)}${rev ? "" : qTimer()}<div class="qt">${esc(S.q.text)}</div><div class="opts${rev ? " rev" : UI.mine !== null ? " picked" : ""}">`;
    S.q.opts.forEach((o, i) => {
      const who = rev ? Object.keys(R.ans).filter(p => R.ans[p].c === i).map(Number) : [];
      const right = rev && R.correct === i, wrong = rev && !right && who.length;
      let tagx = "";
      if (right) tagx += '<span class="pill ok ptag">✓ helyes</span>';
      
      h += `<button class="opt o${i}${UI.mine === i && !rev ? " mine" : ""}${right ? " right" : ""}${wrong ? " wrong" : ""}" data-c="${i}" ${!need || rev || UI.mine !== null ? "disabled" : ""}>
        <span class="let l${i}">${SHAPES[i]}</span><span class="tx">${esc(o)}</span><span class="ltr">${"ABCD"[i]}</span>${tagx || who.length ? `<span class="side-r">${tagx}<span class="stack">${who.map(p => av(S, p, "sm")).join("")}</span></span>` : ""}${!rev && UI.mine === i ? '<span class="pill me ptag">a te válaszod</span>' : ""}</button>`;
    });
    h += `</div>`;
    if (!rev) h += `<p class="note" style="margin-top:12px">${need ? (UI.mine !== null ? "Válasz elküldve. A többiek válaszát a végén látod." : "Kattints a szerinted helyes válaszra (vagy 1–4).") : "Ebben a kérdésben nem te játszol — figyeld, ki mit tud."}</p>`;
    else {
      h += `<table class="res">${S.need.map(p => { const a = R.ans[p]; return `<tr><td>${av(S, p, "sm")}</td><td>${PN(S, p)}</td><td class="r">${a ? "ABCD"[a.c] + " · " + (a.t / 1000).toFixed(1).replace(".", ",") + " s" : "—"}</td><td class="r ${R.ok[p] ? "ok" : "bad"}">${R.ok[p] ? "✓ jó" : a ? "✗ rossz" : "✗ nem felelt"}</td></tr>`; }).join("")}</table>`;
      h += `<div class="expl"><b>Helyes: ${"ABCD"[R.correct]}.</b> ${esc(S.q.expl)}</div>`;
    }
    return h;
  }
  if (ph === "tip" || ph === "tip_res"){
    const need = S.need.includes(me);
    let h = `<div class="lbl">Tippkérdés${S.ctx === "bat" ? " · döntetlen csata" : ""}</div>${ctxLine(S)}${ph === "tip" ? qTimer() : ""}<div class="qt">${esc(S.q.text)}</div>`;
    if (ph === "tip"){
      if (need && !UI.tipSent) h += `<form class="tipf" id="tipf" novalidate><div class="wrapi"><input class="inp" type="text" inputmode="decimal" id="tipv" autocomplete="off" placeholder="Tipp"><span class="unit">${esc(S.q.unit)}</span></div><button class="btn pri" type="submit">Küldés</button></form><div class="err" id="tiperr"></div><p class="note">Tizedesvessző is jó (pl. 22,7). Egyenlő eltérésnél a gyorsabb nyer.</p>`;
      else if (need) h += `<div class="sent">✓ Tipped elküldve: ${esc(num(UI.myTip))} ${esc(S.q.unit)} — várjuk a többieket…</div>`;
      else h += `<p class="note">Most a többiek tippelnek — figyeld, ki lesz közelebb.</p>`;
    } else {
      h += `<div class="truth"><b>${esc(num(R.v))}</b><span>${esc(S.q.unit)} · a helyes válasz</span></div><div class="nlbox">${numLine(S)}</div>`;
      h += `<ol class="rank">${R.rank.map((p, k) => { const a = R.ans[p]; const d = a ? a.v - R.v : null; return `<li class="${k === 0 ? "w" : ""}"><span class="pos">${k === 0 ? IC.crown(22, "currentColor") : k + 1}</span>${av(S, p)}<span class="nm">${PN(S, p)}</span><span class="v">${a ? esc(num(a.v)) : "—"}</span><span class="d">${a ? (d === 0 ? "telitalálat" : (d > 0 ? "+" : "−") + num(Math.abs(d))) + " · " + (a.t / 1000).toFixed(1).replace(".", ",") + " s" : "nem tippelt"}</span></li>`; }).join("")}</ol>`;
    }
    return h;
  }
  return `<div class="note">…</div>`;
}
function numLine(S){
  const R = S.reveal, ps = R.rank.filter(p => R.ans[p]);
  const vals = ps.map(p => R.ans[p].v).concat([R.v]);
  let lo = Math.min(...vals), hi = Math.max(...vals); if (lo === hi){ lo -= 1; hi += 1; }
  const pad = (hi - lo) * .1; lo -= pad; hi += pad;
  const W = 520, X = v => 24 + (v - lo) / (hi - lo) * (W - 48);
  const items = ps.map(p => ({ p, x: X(R.ans[p].v) })).sort((a, b) => a.x - b.x);
  let lane = [], last = -1e9, ln = 0; items.forEach(it => { ln = it.x - last < 34 ? ln + 1 : 0; it.l = ln; last = it.x; });
  const maxl = Math.max(0, ...items.map(i => i.l)), H = 104 + maxl * 34, ax = 46;
  let g = `<line x1="16" x2="${W - 16}" y1="${ax}" y2="${ax}" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>`;
  const tx = X(R.v);
  g += `<line x1="${tx}" x2="${tx}" y1="14" y2="${H - 6}" stroke="var(--ok)" stroke-width="3" stroke-dasharray="4 4"/><rect x="${tx - 34}" y="2" width="68" height="20" rx="6" fill="var(--ok)"/><text x="${tx}" y="16" text-anchor="middle" font-family="var(--mono)" font-size="12" font-weight="700" fill="#fff">${esc(num(R.v))}</text>`;
  items.forEach(it => {
    const y = ax + 28 + it.l * 34, a = R.ans[it.p];
    g += `<line x1="${it.x}" x2="${it.x}" y1="${ax}" y2="${y - 13}" stroke="${PCOL[it.p]}" stroke-width="2"/><circle cx="${it.x}" cy="${ax}" r="5" fill="${PCOL[it.p]}"/>`;
    g += `<circle cx="${it.x}" cy="${y}" r="13" fill="${PCOL[it.p]}" stroke="var(--panel)" stroke-width="3"/><text x="${it.x}" y="${y + 4.5}" text-anchor="middle" font-family="var(--disp)" font-weight="700" font-size="13" fill="#fff">${esc(ini(S.players[it.p].name))}</text>`;
    g += `<text x="${it.x + (it.x > W - 80 ? -18 : 18)}" y="${y + 4.5}" text-anchor="${it.x > W - 80 ? "end" : "start"}" font-family="var(--mono)" font-size="12" font-weight="600" fill="var(--ink)">${esc(num(a.v))}</text>`;
  });
  return `<svg class="nl" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tippek számegyenesen">${g}</svg>`;
}
function qTimer(){ return UI.dl ? `<div class="qtimer"><div class="qnum" id="qcd"></div><div class="qbar"><i id="qbar"></i></div></div>` : ""; }
function onMainClick(e){
  const o = e.target.closest(".opt[data-c]");
  if (o && !o.disabled){ UI.mine = +o.dataset.c; act({ type:"ans", c:UI.mine }); draw(); return; }
  const ag = e.target.closest("[data-act=again]");
  if (ag) newGame();
}
function onTipSubmit(e){
  e.preventDefault();
  const i = $("#tipv"); if (!i) return;
  const raw = String(i.value).trim().replace(/\s/g, "").replace(",", ".");
  const v = parseFloat(raw);
  if (!raw || !isFinite(v)){ const er = $("#tiperr"); if (er) er.textContent = "Írj be egy számot (pl. 1885 vagy 22,7)."; i.focus(); return; }
  UI.tipSent = true; UI.myTip = v; act({ type:"tip", v }); draw();
}
function newGame(){
  if (NET.role === "solo"){ hostInit(H.S.players[0].name); hostStart(); return; }
  const S = H.S, ps = [{ name:S.players[0].name, bot:false }], nc = {};
  for (const k in H.conns){ if (S.players[k].bot) continue; const i = ps.length; ps.push({ name:S.players[k].name, bot:false }); nc[i] = H.conns[k]; nc[i].send({ t:"welcome", pid:i }); }
  H.conns = nc; S.players = ps; S.tiles = []; S.picks = {}; S.log = []; S.att = null; S.q = null; S.resPicks = null;
  setPhase("lobby", 0); push();
}
function tick(){
  const qb = $("#qbar"), qc = $("#qcd"), qt = $(".qtimer");
  if (qb && UI.dl){ const ms = Math.max(0, UI.dl - Date.now()), s = Math.ceil(ms / 1000); qb.style.width = (UI.dur ? Math.min(100, ms / UI.dur * 100) : 0) + "%"; qc.textContent = s; qt.classList.toggle("low", s <= 5); }
  const el = $("#cd"), ring = $("#ring"), tm = $("#tmr"); if (!el) return;
  if (!UI.dl){ el.textContent = ""; tm && tm.classList.add("idle"); return; }
  tm && tm.classList.remove("idle");
  const ms = Math.max(0, UI.dl - Date.now()), s = Math.ceil(ms / 1000);
  el.textContent = s || "";
  if (ring) ring.setAttribute("stroke-dasharray", (UI.dur ? Math.min(100, ms / UI.dur * 100) : 0).toFixed(1) + " 100");
  tm && tm.classList.toggle("low", s <= 5 && s > 0);
}
setInterval(tick, 250);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const S = UI.S; if (!S || S.phase !== "q" || UI.mine !== null || !S.need.includes(NET.pid)) return;
  if (["1","2","3","4"].includes(e.key)){ UI.mine = +e.key - 1; act({ type:"ans", c:UI.mine }); draw(); }
});
draw();
</script>
</body>
</html>
